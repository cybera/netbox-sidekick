{% load static %}
{# uPlot v1.6.32 (MIT), vendored under sidekick/static/sidekick/uplot/. #}
{# Previously loaded from leeoniya.github.io; see sidekick/static/sidekick/uplot/README.md #}
<script src="{% static 'sidekick/uplot/uPlot.iife.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'sidekick/uplot/uPlot.min.css' %}" />
<script type="text/javascript">
  function sidekickBits(bits) {
    if (bits == 0) return '';
    if (bits < 0) bits *= -1;
    var s = ['bits', 'Kb', 'Mb', 'Gb', 'Tb', 'Pb'];
    var e = Math.floor(Math.log(bits) / Math.log(1000));
    var value = ((bits / Math.pow(1000, Math.floor(e))).toFixed(2));
    e = (e < 0) ? (-e) : e;
    value += ' ' + s[e];
    return value;
  }

  // NetBox 4.x does not ship jQuery on its UI pages -- the only copy in the
  // tree belongs to the DRF browsable API. These are the vanilla equivalents
  // of the jQuery helpers the graph templates used to call. Do not
  // reintroduce jQuery here; the previous templates loaded it from a CDN,
  // which the first-class rewrite removed without replacing the call sites.
  function sidekickOnReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  function sidekickGraphSize(div) {
    var el = document.getElementById(div);
    return {
      height: 300,
      width: el ? el.clientWidth : 600,
    }
  }

  function sidekickClear(div) {
    var el = document.getElementById(div);
    if (el) el.innerHTML = '';
  }

  function sidekickFetchJson(url, onData) {
    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(onData)
      .catch(function (error) {
        console.error('sidekick: could not load graph data from ' + url, error);
      });
  }

  function sidekickShowEmpty(div, message) {
    var el = document.getElementById(div);
    if (el) el.innerHTML = '<p class="text-muted mb-0">' + message + '</p>';
  }

  // Guard against empty or malformed payloads from the graph endpoints. uPlot
  // data is [xvalues, series1, series2, ...]; a payload whose series are all
  // empty (which is what a service with no ClickHouse rows returns) would
  // otherwise render as a blank chart frame that looks broken.
  function sidekickHasData(payload) {
    var data = payload && payload.graph_data && payload.graph_data.data;
    if (!data || !data.length) return false;
    return data.slice(1).some(function (series) {
      return series && series.length;
    });
  }

  function sidekickSeriesOpts(size) {
    return {
      width: size.width,
      height: size.height,
      axes: [
        {},
        {
          scale: "bits",
          size: 75,
          values: (self, ticks) => ticks.map(rawValue => sidekickBits(rawValue)),
        },
      ],
      series: [
        {},
        {
          label: "In",
          stroke: "#2E7D32",
          fill: "#66BB6A",
          scale: "bits",
          value: (self, rawValue) => sidekickBits(rawValue),
        },
        {
          label: "Out",
          stroke: "#1565C0",
          fill: "#42A5F5",
          scale: "bits",
          value: (self, rawValue) => sidekickBits(rawValue * -1),
        },
      ],
    };
  }
</script>
