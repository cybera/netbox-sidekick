{% include 'sidekick/template_content/_graph_assets.html' %}
<div class="card">
  <h5 class="card-header">Graphs</h5>
  <div class="card-body">
    <div id="sidekick-service-graph"></div>
  </div>
</div>
<script type="text/javascript">
(function () {
  var div = 'sidekick-service-graph';
  sidekickOnReady(function () {
    sidekickFetchJson(
      "{% url 'plugins:sidekick:network_service_graphite_data' pk=object.pk %}",
      function (json) {
        if (!sidekickHasData(json)) {
          sidekickShowEmpty(div, 'No bandwidth data available for this service.');
          return;
        }
        var size = sidekickGraphSize(div);
        var u = new uPlot(
          sidekickSeriesOpts(size),
          json.graph_data.data,
          document.getElementById(div)
        );
        window.addEventListener("resize", function () {
          u.setSize(sidekickGraphSize(div));
        });
      }
    );
  });
})();
</script>
